<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Virtual Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#222}
.container{width:100%;max-width:920px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 10px;font-size:24px}
.nav{margin-bottom:18px;font-size:13px}.nav a{color:#1677ff;text-decoration:none}
.row{margin-top:16px}
button{width:100%;padding:13px 20px;border:0;border-radius:9px;background:#1677ff;color:#fff;font-size:16px;cursor:pointer}
button:disabled{background:#aaa}
.progress-bg{width:100%;height:15px;background:#e9edf3;border-radius:20px;overflow:hidden;margin-top:15px}
.progress-bar{width:0;height:100%;background:linear-gradient(90deg,#1677ff,#36cfc9,#1677ff);background-size:200% 100%;animation:flow 1.4s linear infinite;transition:width .25s}
@keyframes flow{to{background-position:200% 0}}
.percent{margin-top:8px;font-size:25px;font-weight:700}
.status{margin-top:10px;color:#555;line-height:1.7}
.info,.stats{margin-top:15px}
.info{padding:14px;background:#f7f8fa;border-radius:10px;font-size:14px;line-height:1.8;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;background:#f7f8fa;border-radius:9px}.label{font-size:12px;color:#888}.value{font-size:17px;font-weight:600;margin-top:4px}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ddd;border-top-color:#1677ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.success{margin-top:15px;padding:14px;background:#f0fff4;border:1px solid #b7ebc6;color:#237804;border-radius:9px;word-break:break-all}
.error{margin-top:15px;padding:14px;background:#fff2f0;border:1px solid #ffccc7;color:#cf1322;border-radius:9px;word-break:break-all}
.small{margin-top:16px;font-size:12px;color:#888;line-height:1.7}
video{display:block;width:100%;margin-top:22px;background:#000;border-radius:10px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.container{padding:16px}}
</style>
</head>
<body>
<div class="container">
<h1>Virtual Video</h1>
<div class="nav"><a href="/files">查看全部已上传文件 →</a></div>
<div class="row"><input id="file" type="file" accept="video/*"></div>
<div class="row" style="padding:14px;background:#f7f8fa;border-radius:10px">
  <b>链接上传（360 优先）</b>
  <div style="margin-top:8px"><input id="sourceUrl" type="url" placeholder="粘贴 MP4 / MP3 / M3U8 链接" style="width:100%;padding:12px;border:1px solid #d9d9d9;border-radius:8px;font-size:15px"></div>
  <div style="margin-top:8px"><button id="uploadUrl" type="button">开始链接上传</button></div>
  <div style="font-size:12px;color:#888;margin-top:6px">服务端抓取链接并上传；结果清单保存在 storage/linkjobs，完成后返回后端播放/Range 地址。</div>
</div>
<div class="row"><button id="upload">开始上传</button></div>
<div class="progress-bg"><div id="bar" class="progress-bar"></div></div>
<div id="percent" class="percent">0%</div>
<div id="status" class="status">等待选择视频</div>
<div class="stats">
<div class="stat"><div class="label">浏览器已提交</div><div id="browser" class="value">0 / 0</div></div>
<div class="stat"><div class="label">后台已完成</div><div id="done" class="value">0 / 0</div></div>
<div class="stat"><div class="label">后台处理</div><div id="processing" class="value">0</div></div>
<div class="stat"><div class="label">后台排队</div><div id="queued" class="value">0</div></div>
<div class="stat"><div class="label">失败</div><div id="failed" class="value">0</div></div>
<div class="stat"><div class="label">浏览器速度</div><div id="speed" class="value">0 MB/s</div></div>
</div>
<div id="info" class="info"></div>
<div class="small">
5 MiB 分片 · 浏览器 8 并发 · 服务器实时转发上传。<br>
无上限
</div>
<video id="video" controls playsinline preload="metadata"></video>
</div>
<script>
const CHUNK_SIZE=5*1024*1024;
const UPLOAD_CONCURRENCY=8;
const MAX_RETRY=3;

const $=id=>document.getElementById(id);
const fileInput=$('file'),uploadButton=$('upload'),uploadUrlButton=$('uploadUrl'),sourceUrl=$('sourceUrl'),bar=$('bar'),percent=$('percent'),
status=$('status'),info=$('info'),video=$('video'),browser=$('browser'),done=$('done'),
processing=$('processing'),queued=$('queued'),failed=$('failed'),speed=$('speed');

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function bytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'}
function setProgress(v){v=Math.max(0,Math.min(100,v));bar.style.width=v+'%';percent.textContent=v.toFixed(0)+'%'}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function jsonFetch(url,opt={}){
    const r=await fetch(url,opt);
    let d=null;try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d?.error||`HTTP ${r.status}`);
    return d;
}
function fnv1a64(bytes){
    let h=0xcbf29ce484222325n;
    const prime=0x100000001b3n;
    const mask=0xffffffffffffffffn;
    for(let i=0;i<bytes.length;i++){
        h^=BigInt(bytes[i]);
        h=(h*prime)&mask;
    }
    return h.toString(16).padStart(16,'0');
}
async function fileFingerprint(file){
    const take=4*1024*1024;
    const first=await file.slice(0,Math.min(take,file.size)).arrayBuffer();
    const last=await file.slice(Math.max(0,file.size-take),file.size).arrayBuffer();
    const meta=new TextEncoder().encode(`${file.name}\n${file.size}\n${file.lastModified}\n`);
    const all=new Uint8Array(meta.byteLength+first.byteLength+last.byteLength);
    all.set(meta,0);
    all.set(new Uint8Array(first),meta.byteLength);
    all.set(new Uint8Array(last),meta.byteLength+first.byteLength);

    // crypto.subtle 在 http://IP:端口 这类非安全上下文中可能不存在。
    // 有 Web Crypto 时使用 SHA-256；否则使用无依赖的 64-bit FNV-1a，保证 HTTP 页面也能断点/秒传。
    if(globalThis.crypto?.subtle?.digest){
        const digest=await globalThis.crypto.subtle.digest('SHA-256',all);
        return 'sha256:'+Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');
    }
    return 'fnv64:'+fnv1a64(all);
}
async function createVideo(file,fingerprint){
    return jsonFetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({filename:file.name,size:file.size,contentType:file.type||'video/mp4',fingerprint,lastModified:file.lastModified})});
}
async function uploadChunk(id,file,index,chunkSize,uploaded){
    if(uploaded.has(index))return {skipped:true};
    const start=index*chunkSize,end=Math.min(start+chunkSize,file.size);
    const blob=file.slice(start,end);
    if(blob.size!==end-start)throw new Error(`chunk ${index} 大小异常`);
    let last;
    for(let a=1;a<=MAX_RETRY;a++){
        try{
            const form=new FormData();
            // 原始 5 MiB 分片直接发给 Go，不包装、不加 125 字节前缀。
            form.append('picFile',blob,`chunk_${String(index).padStart(8,'0')}.bin`);
            const result=await jsonFetch(`/api/videos/${id}/chunks/${index}`,{method:'POST',body:form});
            return result;
        }catch(e){
            last=e;
            if(a<MAX_RETRY)await sleep(a*800);
        }
    }
    throw last;
}
async function concurrentUpload(id,file,count,chunkSize,uploaded){
    let next=0,ok=0,firstError=null;
    const started=Date.now();
    async function worker(){
        while(true){
            const i=next++;
            if(i>=count)return;
            try{
                const result=await uploadChunk(id,file,i,chunkSize,uploaded);
                ok++;
                if(result?.skipped) browser.textContent=`${ok} / ${count}`;
                browser.textContent=`${ok} / ${count}`;
                const sec=Math.max(.1,(Date.now()-started)/1000);
                const sent=Math.min(file.size,ok*chunkSize);
                speed.textContent=`${(sent/sec/1048576).toFixed(2)} MB/s`;
            }catch(e){console.error('chunk',i,e);if(!firstError)firstError=e}
        }
    }
    await Promise.all(Array.from({length:Math.min(UPLOAD_CONCURRENCY,count)},worker));
    if(firstError)throw firstError;
}
async function poll(id){
    const deadline=Date.now()+10*60*1000;
    while(Date.now()<deadline){
        try{
            const d=await jsonFetch(`/api/videos/${id}/progress?t=${Date.now()}`,{cache:'no-store'});
            browser.textContent=`${d.browserAccepted||0} / ${d.total||0}`;
            done.textContent=`${d.done||0} / ${d.total||0}`;
            processing.textContent=d.processing||0;
            queued.textContent=d.queued||0;
            failed.textContent=d.failed||0;
            setProgress(d.percent||0);
            if(d.status==='ready'){
                setProgress(100);
                status.textContent='全部处理完成';
                if(d.videoUrl){
                    info.innerHTML=`<b>最终视频链接</b><div class="success"><a href="${esc(d.videoUrl)}" target="_blank">${esc(d.videoUrl)}</a></div>`;
                    video.src=d.videoUrl;video.load();
                }
                uploadButton.disabled=false;
                return;
            }
            if(d.failed)status.innerHTML='<span class="spinner"></span>后台存在失败分片，请检查服务器日志';
            else if((d.processing||0)||(d.uploading||0))status.innerHTML=`<span class="spinner"></span>Node 后台处理中：${d.done||0}/${d.total||0}`;
            else if(d.queued)status.innerHTML=`<span class="spinner"></span>Node 后台排队：${d.queued}`;
            else status.innerHTML='<span class="spinner"></span>已提交，等待 Go 后台任务状态...';
        }catch(e){console.warn('progress',e)}
        await sleep(1200);
    }
    throw new Error('等待后台处理超过 10 分钟。请检查服务端日志和 /api/videos/{id}/progress 接口返回值。');
}
uploadUrlButton.onclick=async()=>{
    const url=sourceUrl.value.trim();
    if(!/^https?:\/\//i.test(url)) return alert('请填写 http:// 或 https:// 开头的文件/M3U8 链接');
    uploadUrlButton.disabled=true; uploadButton.disabled=true;
    setProgress(0); info.textContent=''; video.removeAttribute('src'); video.load();
    status.innerHTML='<span class="spinner"></span>Go 正在获取源链接并上传到 360，请稍候...';
    try {
        const d=await jsonFetch('/api/upload-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
        setProgress(100);
        if(d.type==='m3u8') {
            const p=d.playlistUrl||'';
            info.innerHTML='<b>处理完成（M3U8）</b><div class="success">主/子播放列表解析完成。<br>播放列表：<a href="'+esc(p)+'" target="_blank">'+esc(p)+'</a><br>此链接是后端生成的重写播放列表，媒体分片走本服务器代理。</div><button type="button" id="copyLinkResult" style="margin-top:10px">复制播放列表链接</button><pre style="white-space:pre-wrap;word-break:break-all">'+esc(JSON.stringify(d,null,2))+'</pre>';
            $('copyLinkResult').onclick=()=>navigator.clipboard?.writeText(new URL(p,location.href).href);
            video.src=p;video.load();sourceUrl.value=url;status.textContent='M3U8 处理完成，已生成后端播放列表';
        } else {
            const p=d.url||''; const full=p?new URL(p,location.href).href:'';
            info.innerHTML='<b>链接上传结果</b><div class="success">文件：'+esc(d.filename||'')+'<br>大小：'+bytes(d.size||0)+'<br>成功分片：'+(d.parts?.length||d.uploadedParts?.length||0)+'<br>后端清单：'+(d.manifestSaved?'已保存':'未确认')+'<br>完整文件访问地址：'+(full?'<a href="'+esc(full)+'" target="_blank">'+esc(full)+'</a>':'无')+'</div><button type="button" id="copyLinkResult" style="margin-top:10px">复制完整文件链接</button><details style="margin-top:10px"><summary>查看分片明细</summary><pre style="white-space:pre-wrap;word-break:break-all">'+esc(JSON.stringify(d.parts||d.uploadedParts||[],null,2))+'</pre></details>';
            $('copyLinkResult').onclick=()=>navigator.clipboard?.writeText(full);
            if(full){video.src=full;video.load();} status.textContent=d.success?'链接上传完成，后端播放/Range 地址已生成':'上传未完全成功，已保存已成功分片信息';
        }
    } catch(e) { status.textContent='链接上传失败：'+(e.message||e); info.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'; }
    finally { uploadUrlButton.disabled=false; uploadButton.disabled=false; }
};
uploadButton.onclick=async()=>{
    const file=fileInput.files?.[0];
    if(!file)return alert('请先选择视频');
    uploadButton.disabled=true;video.removeAttribute('src');video.load();
    setProgress(0);browser.textContent='0 / 0';done.textContent='0 / 0';processing.textContent='0';queued.textContent='0';failed.textContent='0';speed.textContent='0 MB/s';info.textContent='';
    try{
        status.innerHTML='<span class="spinner"></span>正在识别文件（用于断点续传/秒传）...';
        const fingerprint=await fileFingerprint(file);
        const c=await createVideo(file,fingerprint);
        const chunkSize=c.chunkSize||CHUNK_SIZE,count=c.chunkCount||Math.ceil(file.size/chunkSize);
        const uploaded=new Set((c.uploadedChunks||[]).map(Number));
        info.innerHTML=`文件：${esc(file.name)}<br>大小：${bytes(file.size)}<br>分片：${count}<br>已存在：${uploaded.size}<br>浏览器并发：${UPLOAD_CONCURRENCY}`;
        if(c.alreadyExists || c.status==='ready'){
            setProgress(100);browser.textContent=`${count} / ${count}`;done.textContent=`${count} / ${count}`;status.textContent='文件已存在，秒传';
            video.src=c.url;video.load();uploadButton.disabled=false;return;
        }
        const polling=poll(c.id);
        status.innerHTML=`<span class="spinner"></span>${uploaded.size?'断点续传：从已完成分片继续':'浏览器并发上传中...'}`;
        browser.textContent=`${uploaded.size} / ${count}`;
        await concurrentUpload(c.id,file,count,chunkSize,uploaded);
        status.innerHTML='<span class="spinner"></span>上传完成，确认任务...';
        await jsonFetch(`/api/videos/${c.id}/complete`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
        await polling;
    }catch(e){
        console.error(e);status.textContent='上传失败：'+(e?.message||e);
        info.innerHTML=`<div class="error">${esc(e?.message||e)}</div>`;uploadButton.disabled=false;
    }
};
</script>
</body>
</html>
